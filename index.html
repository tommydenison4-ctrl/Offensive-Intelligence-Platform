<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ULM Offensive Intelligence</title>
<style>
:root{--bg:#06101c;--panel:#0b1828;--line:#243951;--text:#f5f7fb;--muted:#9fb0c3;--gold:#d7b35c}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);overflow:hidden}.shell{height:100%;display:grid;grid-template-rows:74px 1fr}.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:#07111f;border-bottom:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:5}.logo{width:48px;height:48px;object-fit:contain}.brand{min-width:0}.title{font-weight:900;font-size:18px;letter-spacing:.02em}.sub{font-size:11px;color:var(--muted);margin-top:2px}.picker{margin-left:auto;display:flex;align-items:center;gap:9px}.picker label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800}.picker select{appearance:none;background:#102238;color:#fff;border:1px solid #38506b;border-radius:10px;padding:10px 36px 10px 12px;font-weight:800;font-size:13px;min-width:210px;background-image:linear-gradient(45deg,transparent 50%,#d7b35c 50%),linear-gradient(135deg,#d7b35c 50%,transparent 50%);background-position:calc(100% - 16px) 16px,calc(100% - 11px) 16px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}.week{border:1px solid #725a2d;color:#f1d17f;background:#211d12;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900;letter-spacing:.08em}.frame{width:100%;height:100%;border:0;background:#07111f}@media(max-width:700px){.shell{grid-template-rows:68px 1fr}.top{padding:8px 10px;gap:8px}.logo{width:42px;height:42px}.title{font-size:14px}.sub,.picker label,.week{display:none}.picker select{min-width:160px;padding:9px 31px 9px 10px;font-size:12px}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <img class="logo" src="ulm_avg_roundel_edge_star.png" alt="ULM">
    <div class="brand"><div class="title">ULM Offensive Intelligence</div><div class="sub">Opponent defensive preparation</div></div>
    <div class="picker"><label for="prepOpponent">Prep Opponent</label><select id="prepOpponent">
      <option value="SA">South Alabama</option>
      <option value="FAU">Florida Atlantic</option>
      <option value="SELA">Southeastern Louisiana</option>
      <option value="UAB">UAB</option>
      <option value="MSST">Mississippi State</option>
    </select></div>
    <div class="week">WEEK 5</div>
  </header>
  <iframe id="appFrame" class="frame" title="ULM Offensive Intelligence"></iframe>
</div>
<script>
const selector=document.getElementById('prepOpponent');
const frame=document.getElementById('appFrame');
const LEGACY=new Set(['MSST','UAB','SELA','FAU']);
let current='SA';
function hideLegacyPicker(){try{const doc=frame.contentDocument;const sel=doc&&doc.getElementById('opponentSelect');if(sel){const wrap=sel.closest('.opp-wrap')||sel.parentElement;if(wrap)wrap.style.display='none';}}catch(e){}}
function setLegacyOpponent(key){try{const w=frame.contentWindow;if(w&&typeof w.setPrepOpponent==='function')w.setPrepOpponent(key);hideLegacyPicker();}catch(e){}}
function switchOpponent(key){key=String(key||'SA').toUpperCase();if(!['SA','FAU','SELA','UAB','MSST'].includes(key))key='SA';current=key;selector.value=key;localStorage.setItem('ulm_main_prep_opponent',key);if(key==='SA'){if(!frame.src.endsWith('/south-alabama.html'))frame.src='south-alabama.html';}else{if(!frame.src.endsWith('/legacy.html'))frame.src='legacy.html';else setLegacyOpponent(key);}}
selector.addEventListener('change',e=>switchOpponent(e.target.value));
frame.addEventListener('load',()=>{if(LEGACY.has(current)){setTimeout(()=>setLegacyOpponent(current),60);setTimeout(()=>setLegacyOpponent(current),500);setTimeout(hideLegacyPicker,1200);}});
const saved=String(localStorage.getItem('ulm_main_prep_opponent')||'SA').toUpperCase();switchOpponent(['SA','FAU','SELA','UAB','MSST'].includes(saved)?saved:'SA');
</script>
</body>
</html>
